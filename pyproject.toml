[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "homeassistantpy"
version = "0.2.0"
description = "Home Assistant REST client and JSON tools for agents"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.scripts]
homeassistantpy = "homeassistantpy.cli:main"

[tool.setuptools]
packages = ["homeassistantpy"]
include-package-data = false

[tool.setuptools.package-data]
homeassistantpy = ["py.typed"]
